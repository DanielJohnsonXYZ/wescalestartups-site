name: Integrate WSS growth tools

on:
  push:
    branches:
      - feature/resources-growth-tools
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/resources-growth-tools
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Escape the generated Astro title expression
        run: |
          python - <<'PY'
          from pathlib import Path
          file = Path('scripts/integrate-growth-tools.mjs')
          source = file.read_text()
          source = source.replace('title={\\`${title} | Free WSS Growth Tool\\`}', 'title={\\`\\${title} | Free WSS Growth Tool\\`}')
          file.write_text(source)
          PY
      - name: Generate native growth tool pages
        run: node scripts/integrate-growth-tools.mjs
      - name: Replace standalone history routing with real page navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          file = Path('public/growth-tools/app.js')
          source = file.read_text()
          start = source.index('function currentPath()')
          end = source.index("document.addEventListener('click'")
          navigation = (
              "function currentPath(){return ROUTES.includes(location.pathname)?location.pathname:ROUTES[0];}\n"
              "function currentTool(){return Object.keys(TOOL_META).find(k=>TOOL_META[k].route===currentPath())||'bottleneck';}\n"
              "function go(path,source='navigation'){\n"
              "  const destination=ROUTES.includes(path)?path:'/resources#growth-tools';\n"
              "  const destinationTool=Object.keys(TOOL_META).find(k=>TOOL_META[k].route===destination)||'';\n"
              "  if(destinationTool)track('Next Tool Selected',{tool:currentTool(),source,destination:destinationTool});\n"
              "  window.location.assign(destination);\n"
              "}\n"
          )
          file.write_text(source[:start] + navigation + source[end:])
          PY
      - name: Keep static path data inside getStaticPaths
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          file = Path('src/pages/resources/[tool].astro')
          source = file.read_text()
          match = re.search(r'const tools = ([\s\S]*?) as const;\n\nexport function getStaticPaths\(\) \{\n  return tools\.map', source)
          if not match:
              raise SystemExit('Unable to locate generated tools list')
          replacement = "export function getStaticPaths() {\n  const tools = " + match.group(1) + " as const;\n  return tools.map"
          file.write_text(source[:match.start()] + replacement + source[match.end():])
          PY
      - name: Preserve the existing legacy bottleneck page
        run: |
          python - <<'PY'
          from pathlib import Path
          file = Path('public/_redirects')
          lines = file.read_text().splitlines()
          lines = [line for line in lines if not line.startswith('/founder-led-growth-bottleneck-map')]
          file.write_text('\n'.join(lines).rstrip() + '\n')
          PY
      - name: Verify generated JavaScript syntax
        run: node --check public/growth-tools/app.js
      - name: Verify Astro and site integrity
        run: |
          npm run check
          npm run build
          npm run check:theme
          npm run verify:build
      - name: Commit generated integration
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/growth-tools src/components/GrowthToolPage.astro src/pages/resources src/styles/growth-tools.css src/components/SiteHeader.astro src/pages/sitemap.xml.ts public/_redirects
          git commit -m "feat: add native WSS growth tools"
          git push origin HEAD:feature/resources-growth-tools
