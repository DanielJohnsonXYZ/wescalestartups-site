name: Apply resources audit fixes

on:
  push:
    branches: [fix/resources-hub-audit-2026-08-06]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resources-hub-audit-2026-08-06
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply audited resource fixes
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              write(path, text.replace(old, new, 1))

          # Remove the final external tool link from the homepage stage selector.
          replace_once(
              "src/components/StageSelector.astro",
              'secondaryHref: "https://wss-growth-tools.vercel.app/customer",',
              'secondaryHref: "/resources/customer-segment",'
          )

          # Make the new diagnostic the single sitewide bottleneck entry point.
          site_path = "src/site.ts"
          site = read(site_path)
          config_old = '''  scorecardName: "Growth Bottleneck Scorecard",
            scorecardTagline: "10 questions. 5 minutes. Find the constraint stopping pipeline from becoming predictable.",
            scorecardLabel: "Take the Growth Bottleneck Scorecard",
            scorecardLabelLong: "Take the Growth Bottleneck Scorecard",
            scorecardUrl: "/resources/growth-bottleneck-scorecard",'''
          config_new = '''  scorecardName: "Growth Dependency Diagnostic",
            scorecardTagline: "12 questions. 4 minutes. Find the commercial capability that still depends on founder knowledge, effort or judgement.",
            scorecardLabel: "Take the Growth Dependency Diagnostic",
            scorecardLabelLong: "Take the Growth Dependency Diagnostic",
            scorecardUrl: "/resources/growth-dependency",'''
          if config_old not in site:
              raise SystemExit("Primary scorecard config block was not found")
          site = site.replace(config_old, config_new, 1)

          for magnet_id in ("growth-bottleneck-scorecard", "founder-led-growth-diagnostic"):
              pattern = re.compile(r'\n  \{\n    id: "' + re.escape(magnet_id) + r'",.*?\n  \},', re.S)
              site, count = pattern.subn('', site, count=1)
              if count != 1:
                  raise SystemExit(f"Could not remove duplicate lead magnet {magnet_id}")

          site = site.replace('  "/resources/growth-bottleneck-scorecard": "2026-05-11",\n', '')
          site = site.replace('  "/resources/founder-led-growth-diagnostic": "2026-05-11",\n', '')
          site = site.replace('  "/resources": "2026-07-26",', '''  "/resources": "2026-08-06",
            "/resources/growth-dependency": "2026-08-06",
            "/resources/customer-segment": "2026-08-06",
            "/resources/positioning": "2026-08-06",
            "/resources/gtm-leak": "2026-08-06",
            "/resources/weekly-focus": "2026-08-06",''', 1)
          site = site.replace('/resources/growth-bottleneck-scorecard', '/resources/growth-dependency')
          site = site.replace('Growth Bottleneck Scorecard', 'Growth Dependency Diagnostic')
          site = site.replace('10 questions, 5 minutes', '12 questions, 4 minutes')
          write(site_path, site)

          # Present three non-duplicative templates on the hub.
          resources_path = "src/pages/resources/index.astro"
          resources = read(resources_path)
          first_guide = re.compile(r'const guides = \[\n  \{\n    id: "growth-bottleneck-scorecard",.*?\n  \},\n  \{', re.S)
          replacement = '''const guides = [
            {
              id: "acquisition-channel-matrix",
              title: "Acquisition Channel Decision Matrix",
              format: "Channel selection worksheet",
              bestFor: "Post-PMF teams deciding where to invest the next quarter's acquisition effort",
              sections: [
                "Stage and channel fit",
                "Team capacity",
                "ICP reach",
                "Time to signal",
                "Weighted decision rule"
              ]
            },
            {'''
          resources, count = first_guide.subn(replacement, resources, count=1)
          if count != 1:
              raise SystemExit("Could not replace the duplicate guide card")
          replacements = {
              'title="Free Startup Growth Resources | We Scale Startups"': 'title="Free Startup Growth Tools & Templates | We Scale Startups"',
              'description="Free growth diagnosis guides, sprint planners, and portfolio templates for post-PMF startups building repeatable growth systems."': 'description="Free interactive growth tools, diagnostics, planners and templates for post-PMF AI startups and B2B SaaS teams."',
              'keywords="growth bottleneck scorecard, 90-day growth sprint, VC portfolio template, startup growth diagnosis, post-PMF GTM, fractional CMO resources"': 'keywords="startup growth tools, growth dependency diagnostic, positioning builder, GTM diagnostic, customer segment prioritisation, post-PMF resources"',
              'Practical growth guides for teams between <em>traction and scale.</em>': 'Practical growth tools for teams between <em>traction and scale.</em>',
              'Score positioning, acquisition, conversion, reporting, and founder dependency before you add more activity.': 'Assess sales knowledge, positioning, pipeline, customer proof, learning cadence and hiring foundations before you add more activity.',
              'aria-label="Scorecard details"': 'aria-label="Diagnostic details"',
              '<span><strong>10</strong> questions</span>': '<span><strong>12</strong> questions</span>',
              'title="Start with the tool that matches the decision."': 'title="Use the working template that matches the job."'
          }
          for old, new in replacements.items():
              if old not in resources:
                  raise SystemExit(f"Resources page text not found: {old}")
              resources = resources.replace(old, new, 1)
          write(resources_path, resources)

          # Add an explicit success redirect to reusable signup forms.
          email_path = "src/components/EmailSignup.astro"
          email = read(email_path)
          email = email.replace('  finePrint?: string;\n}', '  finePrint?: string;\n  successRedirect?: string;\n}', 1)
          email = email.replace('  finePrint = "No spam. Unsubscribe any time."\n} = Astro.props;', '  finePrint = "No spam. Unsubscribe any time.",\n  successRedirect = ""\n} = Astro.props;', 1)
          email = email.replace('      data-cio-source-form\n    >', '      data-cio-source-form\n      data-success-redirect={successRedirect || undefined}\n    >', 1)
          success_old = '''          if (status) status.textContent = "You're in. Check your inbox.";
                } else {'''
          success_new = '''          if (status) status.textContent = "You're in. Check your inbox.";
                    window.dataLayer = window.dataLayer || [];
                    window.dataLayer.push({
                      event: "form_submit",
                      form_id: form.dataset.cta || form.id,
                      source_type: (data.get("source_type") || "").toString(),
                      lead_magnet: (data.get("lead_magnet") || "").toString(),
                      page_path: window.location.pathname
                    });
                    const successRedirect = form.dataset.successRedirect || "";
                    if (successRedirect) window.location.assign(successRedirect);
                } else {'''
          if success_old not in email:
              raise SystemExit("Email success handler was not found")
          email = email.replace(success_old, success_new, 1)
          write(email_path, email)

          magnet_path = "src/pages/resources/[slug].astro"
          magnet = read(magnet_path)
          planner_fine = '''          finePrint={isGrowthExperimentPlanner
                    ? "Includes the five-email planner implementation series. Unsubscribe any time."
                    : "No spam. Unsubscribe any time."}
                />'''
          planner_redirect = '''          finePrint={isGrowthExperimentPlanner
                    ? "Includes the five-email planner implementation series. Unsubscribe any time."
                    : "No spam. Unsubscribe any time."}
                  successRedirect={isGrowthExperimentPlanner ? "/resources/90-day-growth-sprint-planner/thanks" : undefined}
                />'''
          if planner_fine not in magnet:
              raise SystemExit("Planner signup component was not found")
          write(magnet_path, magnet.replace(planner_fine, planner_redirect, 1))

          # Give each JS tool a crawlable, structured page and start the assessment directly.
          tool_page = r'''---
          import BaseLayout from "../layouts/BaseLayout.astro";
          import { buildBreadcrumbSchema } from "../lib/schema";
          import { siteConfig } from "../site";
          import "../styles/growth-tools.css";

          interface Props {
            slug: string;
            id: string;
            title: string;
            label: string;
            description: string;
            time: string;
            questions: string;
            previewTitle: string;
            previewText: string;
            outcomes: readonly string[];
            steps: readonly string[];
          }

          const { slug, id, title, label, description, time, questions, previewTitle, previewText, outcomes, steps } = Astro.props;
          const route = `/resources/${slug}`;
          const startFunctions = { bottleneck: "startBottleneck", customer: "startCustomer", positioning: "startPositioning", leak: "startLeak", weekly: "startWeekly" } as const;
          const startFunction = startFunctions[id as keyof typeof startFunctions];
          const schemas = [
            buildBreadcrumbSchema([
              { name: "Home", path: "/" },
              { name: "Resources", path: "/resources" },
              { name: title, path: route }
            ]),
            {
              "@context": "https://schema.org",
              "@type": "WebApplication",
              name: title,
              description,
              url: `${siteConfig.siteUrl}${route}`,
              applicationCategory: "BusinessApplication",
              operatingSystem: "Web browser",
              browserRequirements: "JavaScript enabled",
              isAccessibleForFree: true,
              offers: { "@type": "Offer", price: "0", priceCurrency: "GBP" },
              provider: { "@id": `${siteConfig.siteUrl}/#organization` }
            }
          ];
          ---

          <BaseLayout
            title={`${title} | Free WSS Growth Tool`}
            description={description}
            path={route}
            schema={schemas}
            breadcrumbItems={[{ name: "Home", path: "/" }, { name: "Resources", path: "/resources" }, { name: title, path: route }]}
            stickyBookCta={false}
            showAnnouncement={false}
            bodyClass="growth-tool-page"
          >
            <section class="page-hero growth-tool-page-hero">
              <div class="shell growth-tool-hero-grid">
                <div>
                  <p class="eyebrow">{label}</p>
                  <h1>{title}</h1>
                  <p class="growth-tool-lede">{description}</p>
                  <div class="growth-tool-meta" aria-label="Tool details">
                    <span>{time}</span><span>{questions}</span><span>No sign-up</span><span>Private in this browser</span>
                  </div>
                  <div class="hero-actions">
                    <a class="button button-brand" href="#growth-tool-start" data-direct-tool-start={id} data-cta={`growth-tool-hero-start-${id}`}>Start the tool ↓</a>
                    <a class="button button-light" href="/resources#growth-tools">Explore all five tools →</a>
                  </div>
                </div>
                <aside class="growth-tool-preview" aria-label="Example result">
                  <p class="card-kicker">Example result</p><h2>{previewTitle}</h2><p>{previewText}</p>
                  <div class="growth-tool-preview-flow" aria-hidden="true"><span>Evidence</span><i>→</i><span>Decision</span><i>→</i><span>Action</span></div>
                </aside>
              </div>
            </section>

            <section id="growth-tool-start" class="growth-tool-stage" data-tool={id}>
              <div id="growth-tool-app">
                <div id="app" aria-live="polite"><p class="growth-tool-loading">Loading the tool…</p></div>
                <div id="toast" class="toast" role="status" aria-live="polite">Copied</div>
              </div>
            </section>

            <section class="section section-alt growth-tool-static" aria-labelledby={`growth-tool-outcomes-${id}`}>
              <div class="shell">
                <p class="eyebrow">What you receive</p>
                <h2 id={`growth-tool-outcomes-${id}`}>A focused decision, not a generic score.</h2>
                <div class="grid-3">
                  {outcomes.map((outcome, index) => <article class="feature-card"><p class="card-kicker">0{index + 1}</p><h3>{outcome}</h3></article>)}
                </div>
              </div>
            </section>

            <section class="section growth-tool-static" aria-labelledby={`growth-tool-process-${id}`}>
              <div class="shell two-col">
                <div><p class="eyebrow">How it works</p><h2 id={`growth-tool-process-${id}`}>Evidence first, then a practical next move.</h2></div>
                <ol class="growth-tool-process-list">{steps.map((step) => <li>{step}</li>)}</ol>
              </div>
            </section>

            <noscript><section class="section"><div class="shell"><h2>JavaScript is required for the interactive result.</h2><p>The decision framework and expected outputs are described above. Enable JavaScript to save progress and calculate the diagnosis privately in this browser.</p></div></section></noscript>
            <script is:inline src="/growth-tools/app.js"></script>
            <script is:inline define:vars={{ id, startFunction }}>
              const startButton = document.querySelector(`[data-direct-tool-start="${id}"]`);
              startButton?.addEventListener("click", (event) => {
                event.preventDefault();
                const start = window[startFunction];
                if (typeof start === "function") start();
                document.getElementById("growth-tool-start")?.scrollIntoView({ behavior: "smooth", block: "start" });
              });
            </script>
          </BaseLayout>

          <style>
            .growth-tool-page-hero{padding-block:clamp(3.5rem,7vw,6.5rem)}.growth-tool-hero-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(320px,.72fr);gap:clamp(2.5rem,6vw,6rem);align-items:center}.growth-tool-page-hero h1{max-width:14ch;font-size:clamp(3rem,5.4vw,5.6rem)}.growth-tool-lede{max-width:62ch;font-size:clamp(1.05rem,1.8vw,1.25rem)}.growth-tool-meta{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:1.5rem}.growth-tool-meta span{border:1px solid var(--border);border-radius:999px;padding:.45rem .72rem;background:rgba(255,255,255,.58);font-size:.78rem;font-weight:700}.growth-tool-preview{border:1px solid var(--border);border-radius:1.25rem;background:var(--surface);padding:clamp(1.4rem,3vw,2.1rem);box-shadow:var(--shadow-soft)}.growth-tool-preview h2{margin:.5rem 0 .75rem;font-size:clamp(1.7rem,3vw,2.55rem)}.growth-tool-preview p:not(.card-kicker){color:var(--muted)}.growth-tool-preview-flow{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem;margin-top:1.4rem}.growth-tool-preview-flow span{border-radius:999px;background:var(--surface-muted);padding:.45rem .65rem;font-size:.72rem;font-weight:800}.growth-tool-preview-flow i{color:var(--muted);font-style:normal}.growth-tool-stage{scroll-margin-top:7rem;padding:clamp(1rem,3vw,2rem) 0 clamp(4rem,8vw,7rem);background:linear-gradient(180deg,var(--surface-muted),transparent 24rem)}.growth-tool-loading{text-align:center;padding:4rem 1rem;color:var(--muted)}.growth-tool-static h2{max-width:15ch}.growth-tool-process-list{display:grid;gap:1rem;counter-reset:tool-step;list-style:none;padding:0}.growth-tool-process-list li{counter-increment:tool-step;border:1px solid var(--border);border-radius:1rem;padding:1rem 1rem 1rem 3.7rem;position:relative;background:var(--surface)}.growth-tool-process-list li:before{content:counter(tool-step);position:absolute;left:1rem;top:.85rem;width:2rem;height:2rem;display:grid;place-items:center;border-radius:50%;background:var(--ink);color:#fff;font-weight:800}@media(max-width:820px){.growth-tool-hero-grid{grid-template-columns:1fr}.growth-tool-page-hero h1{max-width:none}.growth-tool-preview{max-width:42rem}}
          </style>
          '''
          write("src/components/GrowthToolPage.astro", tool_page)

          tool_routes = r'''---
          import GrowthToolPage from "../../components/GrowthToolPage.astro";

          export function getStaticPaths() {
            const tools = [
              { slug:"growth-dependency",id:"bottleneck",title:"What is keeping growth dependent on you?",label:"Growth dependency diagnostic",description:"Find the commercial capability that still relies on founder knowledge, effort or judgement, then identify the evidence that would prove it has been transferred.",time:"4 minutes",questions:"12 questions",previewTitle:"Founder-held sales knowledge",previewText:"The strongest sales narrative and objection handling still work best when the founder is personally involved.",outcomes:["One primary founder dependency","The answers that caused the diagnosis","A success condition to test"],steps:["Answer twelve questions about sales knowledge, positioning, pipeline, proof, learning cadence and hiring readiness.","The tool identifies the strongest dependency signal without inventing an overall maturity percentage.","Use the evidence target in the Weekly Focus Planner or bring it to a Growth Audit."] },
              { slug:"customer-segment",id:"customer",title:"Which customer segment should we prioritise next?",label:"Customer segment prioritisation",description:"Compare two or three real customer segments using evidence, economics, retention and delivery fit, then choose where to focus.",time:"6 minutes",questions:"7 criteria",previewTitle:"Leading option",previewText:"A prioritised segment, the strongest evidence behind it and the group to deprioritise for now.",outcomes:["One leading segment","A segment to deprioritise","The weakest evidence to resolve"],steps:["Define two or three specific customer segments you are genuinely considering.","Compare urgency, paid evidence, reachability, commercial value, conversion, retention and delivery fit.","Carry the leading segment directly into the Positioning and Messaging Builder."] },
              { slug:"positioning",id:"positioning",title:"How do I explain what my product does?",label:"Positioning and messaging builder",description:"Turn customer evidence into one clear positioning direction, a homepage message and a practical customer test.",time:"8 minutes",questions:"9 prompts",previewTitle:"A clear working message",previewText:"One positioning foundation, homepage direction, sales introduction and validation plan.",outcomes:["A positioning foundation","Editable homepage and sales copy","A five-customer comprehension test"],steps:["Make nine decisions about the customer, trigger, problem, outcome, alternative, mechanism and proof.","Review the strategic inputs before any copy is generated.","Edit the working outputs and validate customer understanding before publishing them."] },
              { slug:"gtm-leak",id:"leak",title:"Where are we losing customers?",label:"GTM leak diagnostic",description:"Separate volume, conversion and measurement problems across the customer journey, then identify the stage with the greatest likely commercial impact.",time:"5 minutes",questions:"6 stages",previewTitle:"Activation conversion leak",previewText:"The stage to focus on, the failure type, the primary metric and the next evidence target.",outcomes:["One priority journey stage","The failure type at that stage","A metric and evidence target"],steps:["Review demand, qualification, sales, activation, retention and expansion.","Separate missing measurement, insufficient volume and weak conversion instead of treating them as the same problem.","Weight the diagnosis by likely commercial impact and take one candidate fix into the weekly planner."] },
              { slug:"weekly-focus",id:"weekly",title:"What should I focus on this week?",label:"Weekly constraint planner",description:"Compare the strongest diagnoses, choose one constraint and leave with one evidence target and exactly three actions.",time:"5 minutes",questions:"One focused week",previewTitle:"One constraint, not five priorities",previewText:"A Friday evidence target, three time-boxed actions and an explicit defer list.",outcomes:["One constraint for the week","One Friday evidence target","Exactly three time-boxed actions"],steps:["Import completed diagnoses automatically or add two specific priorities manually.","Compare commercial impact, evidence strength, control and urgency.","Protect one focused week and explicitly defer the losing priorities."] }
            ] as const;
            return tools.map((tool) => ({ params: { tool: tool.slug }, props: tool }));
          }
          const tool = Astro.props;
          ---
          <GrowthToolPage {...tool} />
          '''
          write("src/pages/resources/[tool].astro", tool_routes)

          # Keep users inside the tool stage between questions.
          app_path = "public/growth-tools/app.js"
          app = read(app_path)
          anchor = "function currentTool(){return Object.keys(TOOL_META).find(k=>TOOL_META[k].route===currentPath())||'bottleneck';}\n"
          helper = anchor + "function scrollToTool(){requestAnimationFrame(()=>document.getElementById('growth-tool-start')?.scrollIntoView({block:'start'}));}\n"
          if anchor not in app:
              raise SystemExit("Tool scroll insertion point was not found")
          app = app.replace(anchor, helper, 1)
          scroll_count = app.count('window.scrollTo(0,0)')
          if scroll_count < 5:
              raise SystemExit(f"Expected multiple page-top scrolls, found {scroll_count}")
          app = app.replace('window.scrollTo(0,0)', 'scrollToTool()')
          write(app_path, app)

          # Canonical redirects for deprecated overlapping diagnostics.
          canonical_path = "src/lib/sitemapCanonical.ts"
          canonical = read(canonical_path)
          canonical = canonical.replace('  "/quiz": "/resources/growth-bottleneck-scorecard",', '  "/quiz": "/resources/growth-dependency",', 1)
          redirect_anchor = '  "/quiz": "/resources/growth-dependency",\n'
          redirect_block = redirect_anchor + '''  "/resources/growth-bottleneck-scorecard": "/resources/growth-dependency",
            "/resources/founder-led-growth-diagnostic": "/resources/growth-dependency",
            "/founder-led-growth-bottleneck-map": "/resources/growth-dependency",
          '''
          if redirect_anchor not in canonical:
              raise SystemExit("Canonical redirect insertion point was not found")
          canonical = canonical.replace(redirect_anchor, redirect_block, 1)
          write(canonical_path, canonical)

          middleware_path = "functions/_middleware.js"
          middleware = read(middleware_path)
          middleware_anchor = '    // IA consolidation\n'
          middleware_block = '''    // Consolidated resource diagnostics
            "/quiz": "/resources/growth-dependency",
            "/quiz/": "/resources/growth-dependency",
            "/resources/growth-bottleneck-scorecard": "/resources/growth-dependency",
            "/resources/growth-bottleneck-scorecard/": "/resources/growth-dependency",
            "/resources/founder-led-growth-diagnostic": "/resources/growth-dependency",
            "/resources/founder-led-growth-diagnostic/": "/resources/growth-dependency",
            "/founder-led-growth-bottleneck-map": "/resources/growth-dependency",
            "/founder-led-growth-bottleneck-map/": "/resources/growth-dependency",
            // IA consolidation
          '''
          if middleware_anchor not in middleware:
              raise SystemExit("Middleware redirect insertion point was not found")
          middleware = middleware.replace(middleware_anchor, middleware_block, 1)
          write(middleware_path, middleware)

          redirects_path = Path("public/_redirects")
          redirects = redirects_path.read_text() if redirects_path.exists() else ""
          redirect_lines = '''/quiz /resources/growth-dependency 301
          /resources/growth-bottleneck-scorecard /resources/growth-dependency 301
          /resources/growth-bottleneck-scorecard/ /resources/growth-dependency 301
          /resources/founder-led-growth-diagnostic /resources/growth-dependency 301
          /resources/founder-led-growth-diagnostic/ /resources/growth-dependency 301
          /founder-led-growth-bottleneck-map /resources/growth-dependency 301
          /founder-led-growth-bottleneck-map/ /resources/growth-dependency 301
          '''.replace('          ', '')
          if '/resources/growth-bottleneck-scorecard /resources/growth-dependency 301' not in redirects:
              redirects_path.write_text(redirect_lines + redirects)

          # Treat the new primary diagnostic as the scorecard event in existing GTM reports.
          replace_once(
              "src/layouts/BaseLayout.astro",
              'const isScorecard = href.includes("growth-bottleneck-scorecard");',
              'const isScorecard = href.includes("growth-bottleneck-scorecard") || href.includes("growth-dependency");'
          )

          # Permanent repository guard for the Resources product.
          integrity = r'''import fs from "node:fs";
          import path from "node:path";

          const root = process.cwd();
          const read = (file) => fs.readFileSync(path.join(root, file), "utf8");
          const assert = (condition, message) => { if (!condition) { console.error(`Resources integrity failed: ${message}`); process.exit(1); } };
          const routes = ["growth-dependency", "customer-segment", "positioning", "gtm-leak", "weekly-focus"];

          const site = read("src/site.ts");
          const stage = read("src/components/StageSelector.astro");
          const app = read("public/growth-tools/app.js");
          const toolPage = read("src/components/GrowthToolPage.astro");
          const sitemap = read("src/pages/sitemap.xml.ts");
          const middleware = read("functions/_middleware.js");
          const canonical = read("src/lib/sitemapCanonical.ts");
          const magnetPage = read("src/pages/resources/[slug].astro");

          assert(site.includes('scorecardUrl: "/resources/growth-dependency"'), "sitewide primary diagnostic URL is not canonical");
          assert(!site.includes('id: "growth-bottleneck-scorecard"'), "duplicate bottleneck lead magnet remains in site data");
          assert(!site.includes('id: "founder-led-growth-diagnostic"'), "duplicate founder-led diagnostic remains in site data");
          assert(!stage.includes("wss-growth-tools.vercel.app"), "homepage still links to the standalone Vercel app");
          assert(!app.includes("window.scrollTo(0,0)"), "tool steps still scroll above the embedded tool");
          assert(app.includes("function scrollToTool()"), "tool-stage scrolling helper is missing");
          assert(toolPage.includes('"@type": "WebApplication"'), "tool pages lack WebApplication schema");
          assert(toolPage.includes("What you receive"), "tool pages lack crawlable outcome content");
          assert(magnetPage.includes('successRedirect={isGrowthExperimentPlanner ? "/resources/90-day-growth-sprint-planner/thanks"'), "planner signup lacks the download redirect");
          for (const route of routes) assert(sitemap.includes(`"/resources/${route}"`), `sitemap is missing ${route}`);
          for (const oldPath of ["/resources/growth-bottleneck-scorecard", "/resources/founder-led-growth-diagnostic", "/founder-led-growth-bottleneck-map"]) {
            assert(middleware.includes(`"${oldPath}"`), `middleware redirect missing for ${oldPath}`);
            assert(canonical.includes(`"${oldPath}"`), `sitemap canonical redirect missing for ${oldPath}`);
          }
          console.log("Resources hub integrity passed.");
          '''
          write("scripts/check-resources-integrity.mjs", integrity)

          package_path = "package.json"
          package = read(package_path)
          package = package.replace('    "check:links:crawl": "node scripts/check-crawl-links.mjs --input=docs/crawls/latest.csv",', '    "check:links:crawl": "node scripts/check-crawl-links.mjs --input=docs/crawls/latest.csv",\n    "check:resources": "node scripts/check-resources-integrity.mjs",', 1)
          write(package_path, package)

          ci_path = ".github/workflows/ci.yml"
          ci = read(ci_path)
          ci_anchor = '''      - name: Generated-site integrity
                run: npm run verify:build
          '''
          ci_new = ci_anchor + '''
              - name: Resources hub integrity
                run: npm run check:resources
          '''
          if ci_anchor not in ci:
              raise SystemExit("CI insertion point was not found")
          write(ci_path, ci.replace(ci_anchor, ci_new, 1))
          PY

      - name: Install
        run: npm ci

      - name: Astro check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Theme contract
        run: npm run check:theme

      - name: Build integrity
        run: npm run verify:build

      - name: Resources integrity
        run: npm run check:resources

      - name: Crawl link check
        run: |
          if [ -f docs/crawls/latest.csv ]; then npm run check:links:crawl; else echo "No crawl export"; fi

      - name: Commit verified fixes
        run: |
          rm .github/workflows/resources-audit-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix and consolidate Resources hub"
          git push origin HEAD:fix/resources-hub-audit-2026-08-06
