name: Resources audit branch orchestrator

on:
  push:
    branches: [fix/resources-hub-audit-2026-08-06]

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resources-hub-audit-2026-08-06
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Execute audited migration
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/resources-audit-fix.yml').read_text()
          marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Install"
          if marker not in workflow or end_marker not in workflow:
              raise SystemExit('Could not locate the migration script')
          script = workflow.split(marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(textwrap.dedent(script), '<resources-migration>', 'exec'))
          PY

      - name: Install
        run: npm ci

      - name: Astro check
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Theme contract
        run: npm run check:theme

      - name: Build integrity
        run: npm run verify:build

      - name: Resources integrity
        run: npm run check:resources

      - name: Crawl link check
        run: |
          if [ -f docs/crawls/latest.csv ]; then npm run check:links:crawl; else echo "No crawl export"; fi

      - name: Commit verified production changes
        run: |
          rm -f .github/workflows/resources-audit-fix.yml .github/workflows/resources-audit-pr.yml .github/workflows/resources-audit-orchestrator.yml .resources-audit-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix and consolidate Resources hub"
          git push origin HEAD:fix/resources-hub-audit-2026-08-06
