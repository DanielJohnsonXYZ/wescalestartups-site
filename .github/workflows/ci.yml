name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # refresh-lastmod --check reads per-file commit dates, which a
          # shallow clone cannot provide.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Astro check
        run: npm run check

      - name: Build
        env:
          # Optional: when set, the build uploads source maps to Sentry so
          # production stack traces are readable. Absent (e.g. forks) -> skipped.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm run build

      - name: Sitemap lastmod freshness
        run: npm run check:lastmod

      - name: Sitewide theme contract
        run: npm run check:theme

      - name: Generated-site integrity
        run: npm run verify:build

      - name: Resources hub integrity
        run: npm run verify:resources

      - name: Crawl link check (if export exists)
        run: |
          if [ -f docs/crawls/latest.csv ]; then
            npm run check:links:crawl
          else
            echo "Skipping crawl link check: docs/crawls/latest.csv not found"
          fi
